<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 图书馆管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="auth-page" v-cloak>
    <div class="auth-card auth-card-wide">
        <div class="auth-brand">
            <span class="logo">图</span>
            <div>
                <div class="auth-title">注册新账号</div>
                <div class="auth-subtitle">选择角色后填写对应身份信息</div>
            </div>
        </div>

        <div v-if="error" class="form-error">{{ error }}</div>

        <form @submit.prevent="submit">
            <div class="form-grid">
                <div class="field">
                    <label>姓名<span class="required">*</span></label>
                    <input class="input" v-model.trim="form.name" maxlength="30" placeholder="请输入真实姓名">
                </div>
                <div class="field">
                    <label>手机号<span class="required">*</span></label>
                    <input class="input" v-model.trim="form.phone" maxlength="11" placeholder="11 位手机号">
                </div>
                <div class="field">
                    <label>密码<span class="required">*</span></label>
                    <input class="input" type="password" v-model="form.password" maxlength="20" placeholder="6-20 位密码" autocomplete="new-password">
                </div>
                <div class="field">
                    <label>确认密码<span class="required">*</span></label>
                    <input class="input" type="password" v-model="form.confirm" maxlength="20" placeholder="请再次输入密码" autocomplete="new-password">
                </div>
                <div class="field">
                    <label>角色<span class="required">*</span></label>
                    <select class="select" v-model="form.role">
                        <option value="学生">学生</option>
                        <option value="教师">教师</option>
                        <option value="操作员">操作员</option>
                        <option value="管理员">管理员</option>
                    </select>
                </div>
                <div class="field">
                    <label>专业<span class="required">*</span></label>
                    <input class="input" v-model.trim="form.major" maxlength="30" placeholder="如：软件工程">
                </div>

                <template v-if="form.role === '管理员'">
                    <div class="field">
                        <label>权限等级</label>
                        <input class="input" type="number" min="1" v-model="form.permissionLevel" placeholder="默认 1">
                    </div>
                    <div class="field">
                        <label>入职日期</label>
                        <input class="input" type="date" v-model="form.entryTime">
                    </div>
                </template>

                <template v-if="form.role === '操作员'">
                    <div class="field">
                        <label>工作区域<span class="required">*</span></label>
                        <input class="input" v-model.trim="form.area" placeholder="如：一楼借阅区">
                    </div>
                    <div class="field">
                        <label>工作职责<span class="required">*</span></label>
                        <input class="input" v-model.trim="form.duty" placeholder="如：图书上架与借还">
                    </div>
                </template>

                <template v-if="form.role === '学生'">
                    <div class="field">
                        <label>年级<span class="required">*</span></label>
                        <input class="input" v-model.trim="form.grade" placeholder="如：2024级">
                    </div>
                    <div class="field">
                        <label>所属学院<span class="required">*</span></label>
                        <input class="input" v-model.trim="form.college" placeholder="如：计算机学院">
                    </div>
                </template>

                <template v-if="form.role === '教师'">
                    <div class="field">
                        <label>所属学院<span class="required">*</span></label>
                        <input class="input" v-model.trim="form.college" placeholder="如：计算机学院">
                    </div>
                    <div class="field">
                        <label>职称<span class="required">*</span></label>
                        <input class="input" v-model.trim="form.title" placeholder="如：副教授">
                    </div>
                </template>
            </div>

            <div class="form-actions mt-8">
                <a class="btn btn-outline" href="login.html">返回登录</a>
                <button class="btn btn-ghost" type="button" @click="reset">重置</button>
                <button class="btn btn-primary" type="submit" :disabled="loading">
                    {{ loading ? '提交中...' : '提交注册' }}
                </button>
            </div>
        </form>
    </div>
</div>

<script src="vendor/vue.global.prod.js"></script>
<script src="vendor/axios.min.js"></script>
<script src="js/common.js"></script>
<script>
    const { createApp, ref } = Vue;

    function blankForm() {
        return {
            name: '', phone: '', password: '', confirm: '',
            role: '学生', major: '', permissionLevel: 1, entryTime: Lib.today(),
            area: '', duty: '', grade: '', college: '', title: ''
        };
    }

    createApp({
        setup() {
            const form = ref(blankForm());
            const error = ref('');
            const loading = ref(false);

            function reset() {
                form.value = blankForm();
                error.value = '';
            }

            function submit() {
                error.value = '';
                if (!form.value.name) { error.value = '请输入姓名'; return; }
                if (!form.value.phone) { error.value = '请输入手机号'; return; }
                if (!/^1[3-9]\d{9}$/.test(form.value.phone)) { error.value = '手机号格式不正确'; return; }
                if (!form.value.password || form.value.password.length < 6 || form.value.password.length > 20) {
                    error.value = '密码长度应为 6-20 位'; return;
                }
                if (form.value.password !== form.value.confirm) { error.value = '两次输入的密码不一致'; return; }
                if (!form.value.major) { error.value = '请输入专业'; return; }

                const payload = {
                    name: form.value.name,
                    phone: form.value.phone,
                    password: form.value.password,
                    role: form.value.role,
                    major: form.value.major
                };
                if (form.value.role === '管理员') {
                    payload.permissionLevel = form.value.permissionLevel;
                    payload.entryTime = form.value.entryTime;
                } else if (form.value.role === '操作员') {
                    if (!form.value.area) { error.value = '请输入工作区域'; return; }
                    if (!form.value.duty) { error.value = '请输入工作职责'; return; }
                    payload.area = form.value.area;
                    payload.duty = form.value.duty;
                } else if (form.value.role === '学生') {
                    if (!form.value.grade) { error.value = '请输入年级'; return; }
                    if (!form.value.college) { error.value = '请输入所属学院'; return; }
                    payload.grade = form.value.grade;
                    payload.college = form.value.college;
                } else if (form.value.role === '教师') {
                    if (!form.value.college) { error.value = '请输入所属学院'; return; }
                    if (!form.value.title) { error.value = '请输入职称'; return; }
                    payload.college = form.value.college;
                    payload.title = form.value.title;
                }

                loading.value = true;
                Lib.post('/auth/register', payload).then(function () {
                    Lib.toast('注册成功，即将跳转到登录页');
                    setTimeout(function () {
                        location.href = Lib.CTX + '/login.html';
                    }, 900);
                }).catch(function (e) {
                    error.value = Lib.errorMessage(e);
                }).finally(function () {
                    loading.value = false;
                });
            }

            return { form, error, loading, reset, submit };
        }
    }).mount('#app');
</script>
</body>
</html>
